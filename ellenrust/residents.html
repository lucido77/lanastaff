<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ellenrust residents</title>
  <link rel="manifest" href="/manifest-ellenrust-residents.json">
  <meta name="theme-color" content="#3aa6a6">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Residents">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0f172a; }
    .scroll-wrapper { position: absolute; top: 0; right: 0; bottom: 0; left: 0; overflow-y: scroll; -webkit-overflow-scrolling: touch; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <div class="scroll-wrapper">
    <iframe id="app"
      src="https://script.google.com/macros/s/AKfycbw0IGpy2t2LGE65A9sz5BSMhLkVavqmJKJA67CKJbnPtXDfOAOSw5kZ8r46qXgf2s6Gpw/exec"
      allow="fullscreen"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-top-navigation">
    </iframe>
  </div>
  <script>
    var GAS = "https://script.google.com/macros/s/AKfycbw0IGpy2t2LGE65A9sz5BSMhLkVavqmJKJA67CKJbnPtXDfOAOSw5kZ8r46qXgf2s6Gpw/exec";
    var iframe = document.getElementById('app');
    var attempts = 0;

    function check() {
      try {
        var doc = iframe.contentDocument || iframe.contentWindow.document;
        if (!doc || !doc.body || doc.body.innerHTML.trim() === '') {
          if (attempts++ < 30) {
            iframe.src = GAS + '?_r=' + Date.now();
          } else {
            document.body.innerHTML = '<div style="position:fixed;top:0;left:0;right:0;bottom:0;background:#0f172a;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px"><div><p style="color:#94a3b8;font-family:Arial;font-size:16px;margin-bottom:20px">Tap below to open the app</p><a href="' + GAS + '" style="background:#3aa6a6;color:#fff;padding:16px 32px;border-radius:25px;font-family:Arial;font-size:18px;text-decoration:none;display:inline-block">Open Meal App</a></div></div>';
          }
        }
      } catch(e) {
        // cross-origin = loaded successfully, stop checking
        clearInterval(timer);
      }
    }

    var timer = setInterval(check, 2000);
  </script>
</body>
</html>
