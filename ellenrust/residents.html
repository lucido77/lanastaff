<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ellenrust residents</title>
  <link rel="manifest" href="/manifest-ellenrust-residents.json">
  <meta name="theme-color" content="#3aa6a6">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Residents">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0f172a; }
    .scroll-wrapper { position: absolute; top: 0; right: 0; bottom: 0; left: 0; overflow-y: scroll; -webkit-overflow-scrolling: touch; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <div class="scroll-wrapper">
    <iframe id="f" src="https://script.google.com/macros/s/AKfycbw0IGpy2t2LGE65A9sz5BSMhLkVavqmJKJA67CKJbnPtXDfOAOSw5kZ8r46qXgf2s6Gpw/exec" allow="fullscreen" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-top-navigation"></iframe>
  </div>
  <script>
    var src = document.getElementById('f').src;
    var t = setInterval(function(){
      try {
        var d = document.getElementById('f').contentDocument;
        if(!d || !d.body || d.body.innerHTML.trim()===''){
          document.getElementById('f').src = src + '?r=' + Date.now();
        } else {
          clearInterval(t);
        }
      } catch(e){ clearInterval(t); } // cross-origin = loaded OK
    }, 2000);
  </script>
</body>
</html>
